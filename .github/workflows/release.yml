name: release

# Build, Developer ID sign, notarize, and stage a rift-plus release as a draft.
#
# Triggers on a tag like `v0.5.3-plus.1`. Runs on a macOS runner, imports the
# Developer ID Application certificate into a throwaway keychain, builds a
# universal (x86_64 + arm64) binary, signs it with the hardened runtime,
# notarizes it with notarytool, and opens a **draft** GitHub Release with the
# archive attached. Publishing that draft is what bumps the Homebrew tap
# (see tap.yml).
#
# One-time secret setup: docs/ci-setup.md. The names match the yabai-plus repo
# so the same values work for both.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.5.3-plus.1
        required: true

permissions:
  contents: write # needed to create the GitHub Release

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    # macos-14 is deprecated: brownouts through October 2026, unsupported from
    # November 2nd (actions/runner-images#13518).
    #
    # Pinned to 26 rather than macos-latest so the SDK a release is linked
    # against never moves on its own. It is worth pinning deliberately because
    # macOS reads the `sdk` field of LC_BUILD_VERSION to choose a process's
    # appearance: below 26 it gets the pre-Tahoe look for standard AppKit
    # controls, and that applies to a bare binary like rift with no bundle.
    # Nothing rift draws was measurably affected -- the menu bar, alerts and
    # panels come out the same either way, and the drop overlay is exempt
    # because it asks for NSGlassEffectView by name at run time -- but building
    # on the same SDK `just dev` uses keeps releases and local builds on the
    # same side of that switch rather than relying on it staying harmless.
    runs-on: macos-26
    steps:
      # Everything downstream is named from this tag, so a malformed one has to
      # stop the run here rather than produce an archive nobody can install.
      - name: Validate the tag is semver
        id: version
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"

          # Guard the easy mistakes explicitly, because the bare regex failure
          # below reads as "malformed" without saying what to fix.
          case "$TAG" in
            vv*) echo "::error::tag '$TAG' has a doubled 'v' prefix"; exit 1 ;;
            v*)  ;;
            *)   echo "::error::tag '$TAG' must start with 'v'"; exit 1 ;;
          esac

          VERSION="${TAG#v}"
          # semver.org's own grammar, with the optional build-metadata part.
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER"; then
            echo "::error::'$VERSION' is not valid semver (expected e.g. 0.5.3-plus.1)"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      # A tag that disagrees with the metadata would ship a binary whose
      # --version contradicts the formula that installed it. Check the lockfile
      # too: `cargo build` rewrites it, so a bumped Cargo.toml with a stale
      # Cargo.lock means the bump was never committed properly.
      - name: Check project metadata matches the tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml says ${CARGO_VERSION}, tag says ${VERSION}"
            exit 1
          fi

          LOCK_VERSION="$(awk '
            /^name = "rift-wm"$/ { found = 1; next }
            found && /^version = / { gsub(/[",]/, "", $3); print $3; exit }
          ' Cargo.lock)"
          if [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.lock says ${LOCK_VERSION}, tag says ${VERSION} -- run 'just bump' and commit the lockfile"
            exit 1
          fi

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi

      - name: Install Rust + targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Import Apple signing certificate
        # Creates a temporary keychain, imports the Developer ID cert, and sets
        # the key partition list so codesign works non-interactively -- the
        # usual failure when this is done by hand on recent runners.
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build (universal)
        run: |
          set -euxo pipefail
          # No -C target-cpu=native: the runner's CPU is not the user's, and a
          # binary that traps on an unsupported instruction is worse than a
          # slightly slower one.
          cargo build --release --locked --bins --target aarch64-apple-darwin
          cargo build --release --locked --bins --target x86_64-apple-darwin

          mkdir -p dist
          for bin in rift rift-cli; do
            lipo -create \
              "target/aarch64-apple-darwin/release/${bin}" \
              "target/x86_64-apple-darwin/release/${bin}" \
              -output "dist/${bin}"
          done
          # Deliberately not stripped: the release profile keeps debuginfo so
          # crash reports symbolicate.

      # Hardened runtime is safe here even though rift injects into Dock: the
      # loader and payload are written to /Library/ScriptingAdditions at
      # `rift sa load` time and ad-hoc signed separately. Never hardened-sign
      # those two -- they run inside Dock.
      - name: Codesign (hardened runtime)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for bin in rift rift-cli; do
            codesign --force --timestamp --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" "dist/${bin}"
            codesign --verify --strict --verbose=2 "dist/${bin}"
          done

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Notarize
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # notarytool needs a zip/pkg/dmg; bare Mach-O files cannot be
          # submitted directly. Both binaries go up in one submission.
          ditto -c -k --keepParent dist "$RUNNER_TEMP/rift-notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/rift-notarize.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          # A standalone CLI binary cannot be stapled; Gatekeeper checks the
          # notarization ticket online on first run, which is sufficient.

      - name: Assemble archive
        id: archive
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="rift-plus-universal-macos-${VERSION}.tar.gz"

          # The formula installs this into pkgshare and its caveats point at it.
          cp rift.default.toml dist/

          tar -C dist -czf "${ASSET}" rift rift-cli rift.default.toml
          SHA256="$(shasum -a 256 "${ASSET}" | cut -d' ' -f1)"
          printf '%s  %s\n' "${SHA256}" "${ASSET}" > "${ASSET}.sha256"

          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "checksum=${ASSET}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "Built ${ASSET}  sha256=${SHA256}"

      - name: Extract release notes from the changelog
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          # Everything between this version's heading and the next "## ".
          awk -v h="## [${VERSION}]" '
            index($0, h) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            cat "$NOTES_FILE"
            echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "No changelog section found; falling back to generated notes."
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            ${{ steps.archive.outputs.asset }}
            ${{ steps.archive.outputs.checksum }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}

      - name: Summary
        run: |
          {
            echo "### Draft release ${RELEASE_TAG} is ready"
            echo
            echo '`sha256`: `${{ steps.archive.outputs.sha256 }}`'
            echo
            echo "Review it in the Releases tab and publish. Publishing bumps"
            echo "\`Formula/rift-plus.rb\` in the tap (see tap.yml)."
          } >> "$GITHUB_STEP_SUMMARY"
