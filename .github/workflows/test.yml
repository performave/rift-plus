name: test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # `cargo check` also compiles build.rs, which drives `xcrun clang` over
      # src/osax for arm64e -- so a broken payload or loader fails here rather
      # than at release time.
      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked

  format:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # Deliberately not `--all`. The tree inherited from upstream does not
      # satisfy current nightly rustfmt, and reformatting a hundred untouched
      # files to make CI green would destroy the ability to rebase onto
      # upstream. So this gate holds new work to the standard without
      # relitigating the old: only files this fork's own commits touched.
      #
      # --skip-children is part of that: rustfmt follows `mod` declarations, so
      # without it a one-line change to src/lib.rs drags the whole crate in.
      - name: Check formatting of changed files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch reports an all-zero "before"; nothing to diff against.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to diff against; skipping"
            exit 0
          fi

          # A sync merge lands the whole of upstream's history in this range at
          # once, so diffing the endpoints hands rustfmt every file upstream
          # touched -- exactly the relitigation this gate exists to avoid.
          # Fetch upstream so its commits can be subtracted below. Only the
          # commit graph is needed, hence blob:none.
          git remote add upstream https://github.com/acsandmann/rift.git 2>/dev/null || true
          git fetch --quiet --no-tags --filter=blob:none upstream '+refs/heads/*:refs/remotes/upstream/*'
          git rev-parse --verify --quiet refs/remotes/upstream/main >/dev/null

          tmp="$(mktemp -d)"

          # Files this fork authored: everything in the range that upstream does
          # not already carry. Merges are skipped -- one that only reconciles
          # two sides wrote nothing itself, and its combined diff would flag
          # every clean auto-merge alongside any real conflict resolution.
          git log "$base..HEAD" --no-merges --not --remotes=upstream \
            --name-only --pretty=format: -- '*.rs' \
            | sed '/^$/d' | sort -u > "$tmp/ours"

          # Intersect with the endpoint diff, so a file that was touched and
          # then reverted, renamed away or deleted drops back out.
          git diff --name-only --diff-filter=d "$base" HEAD -- '*.rs' \
            | sort -u > "$tmp/touched"

          files="$(comm -12 "$tmp/ours" "$tmp/touched")"
          if [ -z "$files" ]; then
            echo "no Rust files changed by this fork's own commits"
            exit 0
          fi

          echo "$files"
          echo "$files" | xargs rustfmt +nightly --edition 2024 --unstable-features --skip-children --check
